plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '0.2.0'
group = 'com.middleearthmc.rapiddrinking'
base { archivesName = 'middleearth-rapid-drinking' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            mods { middleearthrapidwater { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { middleearthrapidwater { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://cursemaven.com' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    // Same CurseMaven dependency as the original v0.1.0-beta build file.
    implementation fg.deobf('curse.maven:tough-as-nails-246391:5815863')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes(['Specification-Title':'Middle Earth Rapid Drinking',
                    'Specification-Vendor':'Middle Earth MC',
                    'Implementation-Title':project.name,
                    'Implementation-Version':project.version])
    }
    finalizedBy 'reobfJar'
}
