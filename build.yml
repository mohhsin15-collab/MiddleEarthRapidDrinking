name: Build Forge addon
on:
  workflow_dispatch:
  push:
    paths:
      - '**.java'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: middleearth-rapid-drinking
          path: build/libs/*.jar
          if-no-files-found: error
